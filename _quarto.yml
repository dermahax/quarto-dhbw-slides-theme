# Nur für example.qmd in diesem Repo. Ein Vorlesungsprojekt bekommt seine
# eigene _quarto.yml (siehe README).
project:
  title: "quarto-dhbw-slides"
  # loesungen.ts: zu example-uebung.qmd auch example-uebung-loesung.pdf
  # folien-pdf.ts: zu example.qmd auch example.pdf (nur bei quarto render)
  post-render:
    - _extensions/dhbw-slides/loesungen.ts
    - _extensions/dhbw-slides/folien-pdf.ts

lang: de

format:
  dhbw-slides-revealjs: default

dhbw:
  author: "M. Bergau"
  chapters: ["Beispiel"]
  vorlesung: "Beispielvorlesung"
