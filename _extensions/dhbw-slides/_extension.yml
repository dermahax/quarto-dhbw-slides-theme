title: DHBW Slides
author: M. Bergau
version: 1.5.0
quarto-required: ">=1.4.0"
contributes:
  shortcodes:
    - orga.lua
  formats:
    revealjs:
      # ---- Geometrie ----
      width: 1920
      height: 1080
      margin: 0.045
      min-scale: 0.2
      max-scale: 2.0
      center: false

      # ---- Bedienung ----
      controls: true
      progress: true
      slide-number: false   # eigene Seitenzahl in der Fusszeile
      menu: false
      hash: true
      transition: slide

      # ---- Aussehen ----
      theme: [default, dhbw.scss]
      highlight-style: tango

      # ---- eine einzelne, offline lauffaehige HTML-Datei ----
      embed-resources: true
      html-math-method:
        method: katex

      filters:
        - dhbw.lua
      include-after-body: dhbw-chrome.html

    # ---- Übungsblätter als PDF (Typst, in Quarto enthalten) ----
    typst:
      papersize: a4
      fontsize: 10.5pt
      keep-typ: true        # loesungen.lua kompiliert daraus die Lösungsfassung
      template-partials:
        - uebung/typst-template.typ
        - uebung/typst-show.typ
      filters:
        - uebung.lua

    # ---- Übungsblätter als Jupyter-Notebook (Programmieraufgaben) ----
    ipynb:
      execute:
        enabled: false      # Notebook unausgeführt ausgeben
      filters:
        - uebung.lua
