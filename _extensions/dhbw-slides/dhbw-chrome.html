<div class="dhbw-footer">
  <div class="crumbs" id="crumbs"></div>
  <div class="meta"><span id="dhbw-author"></span><span class="pg" id="pg">1</span></div>
</div>

<script>
  (function () {
    // Konfiguration erst beim Start lesen - der Lua-Filter schreibt
    // window.DHBW unter Umstaenden erst nach diesem Skript in die Seite.
    var CFG = {};

    // --- Kapitelleiste aus den Metadaten aufbauen und das aktive Kapitel
    //     markieren. Der Index kommt aus  dhbw.chapter  oder aus dem
    //     Dateinamen, z. B. "05-graphen.html" -> fuenftes Chevron. ---
    function buildCrumbs() {
      var bar = document.getElementById('crumbs');
      if (!bar) return;
      var names = CFG.chapters || [];
      names.forEach(function (name) {
        var s = document.createElement('span');
        s.className = 'chev';
        s.textContent = name;
        bar.appendChild(s);
      });
      var n = CFG.chapter;
      if (!n) {
        var file = decodeURIComponent(location.pathname).split(/[\\/]/).pop();
        var m = file.match(/^(\d+)/);
        if (m) n = parseInt(m[1], 10);
      }
      var chevs = bar.getElementsByClassName('chev');
      if (n >= 1 && n <= chevs.length) chevs[n - 1].classList.add('active');
    }

    function setAuthor() {
      var el = document.getElementById('dhbw-author');
      if (el) el.textContent = CFG.author || '';
    }

    // --- Mathe lokal rendern; danach die Klasse "math" entfernen, damit
    //     Quartos eigener CDN-Renderer nichts mehr findet. ---
    function renderMath() {
      if (typeof katex === 'undefined') return;
      var els = Array.prototype.slice.call(document.getElementsByClassName('math'));
      els.forEach(function (el) {
        if (el.tagName !== 'SPAN') return;
        var tex = el.textContent;
        var display = el.classList.contains('display');
        el.classList.remove('math', 'inline', 'display');
        el.classList.add('dhbw-math');
        try {
          katex.render(tex, el, { displayMode: display, throwOnError: false });
        } catch (e) {
          el.textContent = tex;
        }
      });

      if (typeof renderMathInElement === 'function') {
        renderMathInElement(document.body, {
          delimiters: [
            { left: '\\[', right: '\\]', display: true },
            { left: '\\(', right: '\\)', display: false }
          ],
          ignoredClasses: ['code', 'ide'],
          throwOnError: false
        });
      }
    }

    // --- Fusszeile: Seitenzahl und Cover-Zustand ---
    function updateChrome() {
      var pg = document.getElementById('pg');
      if (!pg || !window.Reveal || !Reveal.getIndices) return;
      var printMode = document.documentElement.classList.contains('print-pdf');
      var i = Reveal.getIndices().h;
      document.body.classList.toggle('cover', !printMode && i === 0);
      pg.textContent = (i + 1);
    }

    function start() {
      CFG = window.DHBW || {};
      buildCrumbs();
      setAuthor();
      renderMath();
      if (window.Reveal && Reveal.on) {
        Reveal.on('ready', function () { updateChrome(); Reveal.layout(); });
        Reveal.on('slidechanged', updateChrome);
      }
      updateChrome();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
</script>
