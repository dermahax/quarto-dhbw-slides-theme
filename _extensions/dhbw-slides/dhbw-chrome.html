<script>
  (function () {
    // Konfiguration erst beim Start lesen - der Lua-Filter schreibt
    // window.DHBW unter Umstaenden erst nach diesem Skript in die Seite.
    var CFG = {};

    // --- PDF-Export: Jede Animation (Heap, Dijkstra, Labyrinth, ...) nur
    //     einmal. Die Animationen legen fuer jeden Schritt ein leeres,
    //     unsichtbares Fragment an, damit Leertaste und Presenter Schritt fuer
    //     Schritt weiterschalten. Mit pdf-separate-fragments wuerde daraus je
    //     Schritt eine PDF-Seite mit immer demselben Bild.
    //     1. Quartos Taste E oeffnet die Druckansicht als ?view=print, die
    //        Animationen erkennen nur ?print-pdf (dann zeigen sie den
    //        Endzustand). Darum auf ?print-pdf umleiten - reveal.js versteht
    //        beides, es gibt also nur noch einen Druckweg.
    //     2. Im Druck leere Fragmente (span/div ohne Inhalt) zu normalen
    //        Elementen machen: Sie aendern nichts Sichtbares, wuerden aber je
    //        eine Seite kosten. Echte Fragmente mit Text, Bild oder Formel
    //        bleiben eigene Seiten. ---
    var SEARCH = location.search;
    if (/(^|[?&])view=print(&|$)/i.test(SEARCH) && !/print-pdf/i.test(SEARCH)) {
      location.replace(location.href.replace(/([?&])view=print/i, '$1print-pdf'));
      return;
    }
    var PRINT = /print-pdf/i.test(SEARCH);

    function isEmptyFragment(f) {
      if (f.tagName !== 'SPAN' && f.tagName !== 'DIV') return false;
      if (f.children.length > 0 || f.textContent.trim() !== '') return false;
      return !f.hasAttribute('style');
    }

    function dropEmptyFragments() {
      var frs = document.querySelectorAll('.reveal .slides .fragment');
      Array.prototype.forEach.call(frs, function (f) {
        if (isEmptyFragment(f)) f.classList.remove('fragment');
      });
    }

    if (PRINT) dropEmptyFragments();

    // --- Kapitelleiste aus den Metadaten aufbauen und das aktive Kapitel
    //     markieren. Der Index kommt aus  dhbw.chapter  oder aus dem
    //     Dateinamen, z. B. "05-graphen.html" -> fuenftes Chevron. ---
    function buildCrumbs() {
      var bar = document.getElementById('crumbs');
      if (!bar) return;
      var names = CFG.chapters || [];
      // dhbw.crumbs: true blendet die Leiste ein; ohne Angabe bleibt sie aus
      var show = CFG.crumbs === true && names.length > 0;
      if (!show) { bar.style.display = 'none'; return; }
      names.forEach(function (name) {
        var s = document.createElement('span');
        s.className = 'chev';
        s.textContent = name;
        bar.appendChild(s);
      });
      var n = CFG.chapter;
      if (!n) {
        var file = decodeURIComponent(location.pathname).split(/[\\/]/).pop();
        var m = file.match(/^(\d+)/);
        if (m) n = parseInt(m[1], 10);
      }
      var chevs = bar.getElementsByClassName('chev');
      if (n >= 1 && n <= chevs.length) chevs[n - 1].classList.add('active');
    }

    // --- Mathe lokal rendern. dhbw-math.lua liefert rohes TeX in
    //     <span class="math inline|display">; nach dem Rendern verliert der
    //     Span die Klasse "math", ein zweiter Aufruf rendert also nichts doppelt.
    //     In Sprechernotizen nur MathML: Die Speaker-Ansicht (Taste S) uebernimmt
    //     das HTML der Notizen, hat aber kein KaTeX-CSS - mit dem ueblichen
    //     HTML+MathML stuende jede Formel dort doppelt. MathML rendert der
    //     Browser selbst. ---
    function inNotes(el) {
      return !!(el.closest && el.closest('aside.notes, .notes'));
    }

    function renderMath(root) {
      if (typeof katex === 'undefined') return;
      root = root || document.body;
      var els = Array.prototype.slice.call(root.getElementsByClassName('math'));
      els.forEach(function (el) {
        if (el.tagName !== 'SPAN') return;
        var tex = el.textContent;
        var display = el.classList.contains('display');
        el.classList.remove('math', 'inline', 'display');
        el.classList.add('dhbw-math');
        try {
          katex.render(tex, el, {
            displayMode: display,
            throwOnError: false,
            output: inNotes(el) ? 'mathml' : 'htmlAndMathml'
          });
        } catch (e) {
          el.textContent = tex;
        }
      });

      if (typeof renderMathInElement === 'function') {
        renderMathInElement(root, {
          delimiters: [
            { left: '\\[', right: '\\]', display: true },
            { left: '\\(', right: '\\)', display: false }
          ],
          ignoredClasses: ['code', 'ide', 'notes'],
          throwOnError: false
        });
      }
    }

    // --- Tabellen in Sprechernotizen. Die Speaker-Ansicht (Taste S) uebernimmt
    //     nur das HTML der Notizen, nicht das Theme-CSS - Tabellen stuenden dort
    //     ohne Abstaende und Linien. Darum bekommt jede Notiz mit Tabelle ein
    //     eigenes <style>, das mit dem HTML hinueberwandert. Die Selektoren
    //     greifen nur im Speaker-Fenster bzw. bei show-notes. ---
    var NOTES_TABLE_CSS =
      '.speaker-controls-notes table, .speaker-notes table {' +
      '  border-collapse: collapse; margin: 0.6em 0; font-size: 0.95em; }' +
      '.speaker-controls-notes th, .speaker-controls-notes td,' +
      '.speaker-notes th, .speaker-notes td {' +
      '  border: 1px solid #c8c8c8; padding: 0.25em 0.8em; vertical-align: top; }' +
      '.speaker-controls-notes thead th, .speaker-notes thead th {' +
      '  background: #eef0f2; font-weight: bold; border-bottom: 2px solid #9a9a9a; }' +
      '.speaker-controls-notes tbody tr:nth-child(even), .speaker-notes tbody tr:nth-child(even) {' +
      '  background: #f7f7f7; }';

    function styleNotesTables() {
      var notes = document.querySelectorAll('aside.notes, .reveal .notes');
      Array.prototype.forEach.call(notes, function (n) {
        if (!n.querySelector('table') || n.querySelector('style.dhbw-notes-css')) return;
        var st = document.createElement('style');
        st.className = 'dhbw-notes-css';
        st.textContent = NOTES_TABLE_CSS;
        n.insertBefore(st, n.firstChild);
      });
    }

    // --- Fusszeile: Seitenzahl und Cover-Zustand ---
    function updateChrome() {
      var pg = document.getElementById('pg');
      if (!pg || !window.Reveal || !Reveal.getIndices) return;
      var printMode = document.documentElement.classList.contains('print-pdf');
      var i = Reveal.getIndices().h;
      document.body.classList.toggle('cover', !printMode && i === 0);
      var cur = Reveal.getCurrentSlide && Reveal.getCurrentSlide();
      document.body.classList.toggle('vollbild',
        !printMode && !!cur && cur.classList.contains('vollbild'));
      pg.textContent = (i + 1);
    }

    // --- reveal.js ersetzt die Folien gelegentlich durch eine HTML-Kopie von
    //     vor dem Rendern: Die Scroll-Ansicht (Taste R, automatisch unter
    //     435 px Breite, z. B. im noch schmalen Moodle-iframe beim Laden)
    //     merkt sich beim Einschalten slides.innerHTML und schreibt es beim
    //     Ausschalten zurueck. Danach stuende wieder rohes TeX da - also neu
    //     rendern, sobald die direkten Kinder von .slides ausgetauscht werden. ---
    function watchSlides() {
      var slides = document.querySelector('.reveal .slides');
      if (!slides || !window.MutationObserver) return;
      new MutationObserver(function () {
        renderMath(slides);
        styleNotesTables();
        if (window.Reveal && Reveal.isReady && Reveal.isReady()) Reveal.layout();
      }).observe(slides, { childList: true });
    }

    // --- Rolle dieses Fensters. Die Speaker-Ansicht (Taste S) laedt dieselbe
    //     Datei zweimal als iframe mit ?receiver: "Aktuelle Folie" (mit
    //     postMessageEvents=true) und "Upcoming". ---
    var IS_RECEIVER = /receiver/i.test(location.search);
    var IS_PREVIEW = IS_RECEIVER && /postMessageEvents=true/i.test(location.search);
    var NS = 'dhbw-sync';

    function send(win, msg) {
      try { if (win && !win.closed) win.postMessage(JSON.stringify(msg), '*'); } catch (e) {}
    }

    function parse(data) {
      if (typeof data !== 'string' || data.indexOf(NS) < 0) return null;
      try { var d = JSON.parse(data); return d && d.namespace === NS ? d : null; }
      catch (e) { return null; }
    }

    // --- Zeichnen in der Speaker-Ansicht auf den Beamer spiegeln.
    //     Das Chalkboard-Plugin meldet jeden Strich, jedes Radieren, Tafel
    //     auf/zu und Loeschen als Ereignis "broadcast" und zeichnet Ereignisse
    //     "received" nach (gedacht fuer Seminar-Plugins). Hier wird beides
    //     zwischen dem Vorschau-iframe und dem Hauptfenster verbunden, per
    //     postMessage - das geht auch bei file://. Koordinaten sind auf die
    //     Foliengroesse normiert, die Fenstergroesse spielt keine Rolle.
    //     Nachgezeichnete Ereignisse sendet das Plugin nicht erneut, es
    //     entsteht also keine Schleife. ---
    function setupSpeakerSync() {
      var peer = null;  // Hauptfenster: Vorschau-iframe; Vorschau: Hauptfenster

      if (IS_PREVIEW) {
        try { peer = window.parent && window.parent.opener; } catch (e) { peer = null; }
      } else if (IS_RECEIVER) {
        return;  // "Upcoming"-Vorschau: nur anzeigen
      }

      // Das Plugin rechnet Striche erst nach einem 'resize' auf die
      // 1920 x 1080-Folie um, vorher in Bildschirmpixeln. Dann landet ein
      // Strich in Vorschau und Beamer (verschieden grosse Fenster) an
      // verschiedenen Stellen. Darum nach dem Start einmal 'resize' ausloesen.
      var fixScale = function () {
        if (!window.Reveal || !Reveal.getPlugin || !Reveal.getPlugin('RevealChalkboard')) return;
        setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 50);
      };
      if (window.Reveal && Reveal.isReady && Reveal.isReady()) fixScale();
      else if (window.Reveal && Reveal.on) Reveal.on('ready', fixScale);

      if (IS_PREVIEW && !peer) return;

      document.addEventListener('broadcast', function (ev) {
        if (!ev.content || ev.content.sender !== 'chalkboard-plugin') return;
        send(peer, { namespace: NS, type: 'chalk', content: ev.content });
      });

      window.addEventListener('message', function (ev) {
        var d = parse(ev.data);
        if (!d) return;
        if (d.type === 'hello' && !IS_RECEIVER) {
          // Vorschau ist (neu) geladen: Zeichnungen der Folien hinschicken
          peer = ev.source;
          document.dispatchEvent(new CustomEvent('welcome'));
        } else if (d.type === 'chalk' && d.content) {
          var msg = new CustomEvent('received');
          msg.content = d.content;
          document.dispatchEvent(msg);
        }
      });

      if (IS_PREVIEW) {
        var hello = function () { send(peer, { namespace: NS, type: 'hello' }); };
        if (window.Reveal && Reveal.isReady && Reveal.isReady()) hello();
        else if (window.Reveal && Reveal.on) Reveal.on('ready', hello);
      } else {
        // Hauptfenster: Speaker-Fenster erkennen (es schickt jede Sekunde
        // einen Heartbeat) und dort das Layout "Folie + Notizen" anbieten
        window.addEventListener('message', function (ev) {
          if (typeof ev.data !== 'string' || ev.data.indexOf('reveal-notes') < 0) return;
          try { addSpeakerLayout(ev.source); } catch (e) {}
          try { addNotesOverlay(ev.source); } catch (e) {}
        });
      }
    }

    // --- Speaker-Ansicht: zusaetzliches Layout "Folie + Notizen" - die
    //     aktuelle Folie gross links, Uhr und Notizen rechts, ohne Vorschau
    //     der naechsten Folie. Das Speaker-Fenster ist ein about:blank-Fenster
    //     des Hauptfensters, darf also von hier aus ergaenzt werden. ---
    var SPEAKER_LAYOUT = 'dhbw-folie';
    var SPEAKER_LAYOUT_TITLE = 'Folie + Notizen';
    var SPEAKER_CSS =
      'body[data-speaker-layout="' + SPEAKER_LAYOUT + '"] #upcoming-slide { display: none; }' +
      'body[data-speaker-layout="' + SPEAKER_LAYOUT + '"] #current-slide {' +
      '  top: 0; left: 0; width: 70%; height: 100%; padding: 6px; }' +
      'body[data-speaker-layout="' + SPEAKER_LAYOUT + '"] #speaker-controls {' +
      '  top: 0; right: 0; left: auto; width: 30%; height: 100%;' +
      '  padding-top: 46px; font-size: 1.15em; }';

    function addSpeakerLayout(win) {
      if (!win || win === window || win.closed) return;
      var doc = win.document;  // wirft bei fremden Fenstern -> ignoriert
      var dd = doc.querySelector('.speaker-layout-dropdown');
      if (!dd || doc.getElementById('dhbw-speaker-css')) return;

      var st = doc.createElement('style');
      st.id = 'dhbw-speaker-css';
      st.textContent = SPEAKER_CSS;
      doc.head.appendChild(st);

      var opt = doc.createElement('option');
      opt.value = SPEAKER_LAYOUT;
      opt.textContent = SPEAKER_LAYOUT_TITLE;
      dd.appendChild(opt);

      var label = doc.querySelector('.speaker-layout-label');
      var fixLabel = function () {
        if (doc.body.getAttribute('data-speaker-layout') === SPEAKER_LAYOUT) {
          dd.value = SPEAKER_LAYOUT;
          if (label) label.textContent = 'Layout: ' + SPEAKER_LAYOUT_TITLE;
        }
      };
      dd.addEventListener('change', function () { setTimeout(fixLabel, 0); });
      // reveal.js merkt sich das Layout; war es zuletzt unseres, Beschriftung setzen
      fixLabel();
    }

    // --- Speaker-Ansicht: Ein Link in den Notes mit der Klasse .notes-overlay
    //     oeffnet sein Ziel (z. B. eine Animation aus figures/) als
    //     Ueberlagerung im Speaker-Fenster statt in einem neuen Tab - man
    //     bleibt in den Folien. Schliessen mit dem Knopf, Klick daneben oder
    //     Esc. Solange die Ueberlagerung den Fokus hat, gehen die Pfeiltasten
    //     an die Animation und blaettern nicht in den Folien.
    //     In der .qmd:  [Animation oeffnen](figures/x/y.html){.notes-overlay target="_blank"}
    //     (target ist nur der Rueckfall fuer Decks ohne dieses Theme.) ---
    var OVERLAY_ID = 'dhbw-notes-overlay';
    var OVERLAY_CSS =
      '#' + OVERLAY_ID + ' { position: fixed; top: 0; left: 0; width: 100%; height: 100%;' +
      '  z-index: 10000; background: rgba(0,0,0,0.8); }' +
      '#' + OVERLAY_ID + ' iframe { position: absolute; top: 48px; left: 1%; width: 98%;' +
      '  height: calc(100% - 58px); border: 0; border-radius: 6px; background: #fff; }' +
      '#' + OVERLAY_ID + ' button { position: absolute; top: 8px; right: 1%; height: 32px;' +
      '  padding: 0 14px; font: 600 15px/1 Helvetica, Arial, sans-serif; color: #1c1c1c;' +
      '  background: #fff; border: 0; border-radius: 6px; cursor: pointer; }' +
      '.speaker-controls-notes a.notes-overlay { display: inline-block; padding: 4px 12px;' +
      '  border-radius: 6px; background: #e2001a; color: #fff; text-decoration: none;' +
      '  font-weight: 600; cursor: pointer; }';

    function addNotesOverlay(win) {
      if (!win || win === window || win.closed) return;
      var doc = win.document;  // wirft bei fremden Fenstern -> ignoriert
      if (!doc.body || doc.getElementById('dhbw-overlay-css')) return;

      var st = doc.createElement('style');
      st.id = 'dhbw-overlay-css';
      st.textContent = OVERLAY_CSS;
      doc.head.appendChild(st);

      var close = function () {
        var o = doc.getElementById(OVERLAY_ID);
        if (o && o.parentNode) o.parentNode.removeChild(o);
      };
      var onEsc = function (ev) {
        if (ev.key !== 'Escape' || !doc.getElementById(OVERLAY_ID)) return;
        ev.preventDefault();
        ev.stopPropagation();
        close();
      };

      doc.addEventListener('click', function (ev) {
        var a = ev.target && ev.target.closest ? ev.target.closest('a.notes-overlay[href]') : null;
        if (!a) return;
        ev.preventDefault();
        ev.stopPropagation();
        close();
        // relativ zur Praesentation aufloesen (das Speaker-Fenster ist about:blank)
        var url;
        try { url = new URL(a.getAttribute('href'), location.href).href; } catch (e) { url = a.href; }

        var o = doc.createElement('div');
        o.id = OVERLAY_ID;
        var btn = doc.createElement('button');
        btn.type = 'button';
        btn.textContent = '\u2715 Schlie\u00dfen (Esc)';
        btn.onclick = close;
        var frame = doc.createElement('iframe');
        frame.setAttribute('title', a.textContent || 'Animation');
        frame.addEventListener('load', function () {
          try { frame.contentWindow.focus(); } catch (e) {}
          // gleiche Herkunft (quarto preview): Esc auch innerhalb der Animation
          try { frame.contentWindow.document.addEventListener('keydown', onEsc, true); } catch (e) {}
        });
        frame.src = url;
        o.appendChild(btn);
        o.appendChild(frame);
        o.addEventListener('click', function (e) { if (e.target === o) close(); });
        doc.body.appendChild(o);
      }, true);

      doc.addEventListener('keydown', onEsc, true);
    }

    // --- Vollbild-Knopf links neben den Chalkboard-Knoepfen (fuer Tablet
    //     und Stift, ohne Tastatur). Ohne Chalkboard steht er allein unten
    //     links. In der Speaker-Vorschau und im PDF-Export nicht. ---
    function addFullscreenButton() {
      if (IS_RECEIVER || document.documentElement.classList.contains('print-pdf')) return;
      var root = document.documentElement;
      if (!(root.requestFullscreen || root.webkitRequestFullscreen)) return;
      var reveal = document.querySelector('.reveal');
      if (!reveal || reveal.querySelector('.dhbw-fullscreen')) return;

      var bar = reveal.querySelector('.slide-chalkboard-buttons');
      if (!bar) {
        bar = document.createElement('div');
        bar.className = 'slide-chalkboard-buttons dhbw-tools';
        reveal.appendChild(bar);
      }
      var btn = document.createElement('span');
      btn.className = 'dhbw-fullscreen';
      btn.title = 'Vollbild (f)';
      btn.innerHTML = '<i class="fas fa-dhbw-expand"></i>';
      btn.onclick = function (ev) {
        ev.preventDefault();
        var fs = document.fullscreenElement || document.webkitFullscreenElement;
        if (fs) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else {
          (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
        }
      };
      bar.insertBefore(btn, bar.firstChild);

      var icon = btn.firstChild;
      var sync = function () {
        var fs = document.fullscreenElement || document.webkitFullscreenElement;
        icon.className = 'fas ' + (fs ? 'fa-dhbw-compress' : 'fa-dhbw-expand');
        btn.title = fs ? 'Vollbild beenden (Esc)' : 'Vollbild (f)';
      };
      document.addEventListener('fullscreenchange', sync);
      document.addEventListener('webkitfullscreenchange', sync);

      // Kapitelpfeile (dhbw.crumbs: true) rechts neben die Knoepfe ruecken
      var crumbs = document.getElementById('crumbs');
      if (crumbs && crumbs.style.display !== 'none') {
        var shift = function () {
          var r = bar.getBoundingClientRect();
          crumbs.style.marginLeft = Math.max(0, r.right - 20) + 'px';
        };
        shift();
        window.addEventListener('resize', shift);
      }
    }

    function start() {
      CFG = window.DHBW || {};
      buildCrumbs();
      setupSpeakerSync();
      renderMath();
      styleNotesTables();
      watchSlides();
      if (window.Reveal && Reveal.on) {
        Reveal.on('ready', function () { updateChrome(); addFullscreenButton(); Reveal.layout(); });
        Reveal.on('slidechanged', updateChrome);
      }
      updateChrome();
      // Ist reveal.js schon fertig, kommt 'ready' nicht mehr
      if (window.Reveal && Reveal.isReady && Reveal.isReady()) addFullscreenButton();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
</script>
